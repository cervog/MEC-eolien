name: Bulletin électricité

# Lancé chaque jour par une tâche planifiée Claude Code (13h25 heure de Paris) via
# workflow_dispatch : la planification « schedule » de GitHub prenait des heures de retard.
on:
  workflow_dispatch:
    inputs:
      send:
        description: "Envoyer le mail"
        type: boolean
        default: true

jobs:
  bulletin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Générer et envoyer le bulletin
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python -m bulletin --out bulletin.html --print \
            ${{ inputs.send && '--send' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulletin
          path: bulletin.html
          if-no-files-found: ignore
